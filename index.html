<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drenthe Ausflüge – Familienabstimmung</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark:  #3a6b35;
      --green-mid:   #5a9e52;
      --green-light: #d4edce;
      --green-pale:  #edf7eb;
      --beige:       #f5f0e8;
      --beige-dark:  #e8dfc8;
      --white:       #ffffff;
      --text:        #2d2d2d;
      --text-light:  #5f6b5a;
      --rain-bg:     #daeaf7;
      --rain-border: #8db9d8;
      --radius:      14px;
      --shadow:      0 2px 10px rgba(0,0,0,.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--beige);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── HEADER ─────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
      color: var(--white);
      text-align: center;
      padding: 28px 20px 22px;
    }
    header h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: .02em; }
    header p  { font-size: .88rem; opacity: .88; margin-top: 5px; }

    /* ── SUMMARY BAR ─────────────────────────── */
    .summary {
      max-width: 480px;
      margin: 0 auto;
      background: var(--green-light);
      border-bottom: 2px solid var(--green-mid);
      text-align: center;
      padding: 10px 16px;
      font-size: .9rem;
      color: var(--green-dark);
      font-weight: 600;
    }

    /* ── MAIN CONTAINER ──────────────────────── */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 12px 8px;
    }

    /* ── ACTIVITY CARD ───────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
      border: 1.5px solid var(--beige-dark);
      transition: box-shadow .2s;
    }
    .card:focus-within { box-shadow: 0 4px 16px rgba(58,107,53,.20); }
    .card.rain {
      border-color: var(--rain-border);
    }

    /* ── ACCORDION HEADER ────────────────────── */
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 14px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: var(--white);
      transition: background .15s;
      position: relative;
    }
    .card-header:active { background: var(--green-pale); }
    .card.rain .card-header { background: #f0f7fd; }
    .card.rain .card-header:active { background: #daeaf7; }

    .card-emoji { font-size: 1.7rem; flex-shrink: 0; line-height: 1; }

    .card-title-wrap { flex: 1; min-width: 0; }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--green-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-tagline {
      font-size: .78rem;
      color: var(--text-light);
      margin-top: 2px;
      line-height: 1.3;
    }

    .card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .rain-badge {
      font-size: .68rem;
      background: var(--rain-bg);
      color: #3a6d9e;
      border: 1px solid var(--rain-border);
      border-radius: 20px;
      padding: 2px 7px;
      font-weight: 600;
      white-space: nowrap;
    }
    .chevron {
      color: var(--green-mid);
      font-size: .85rem;
      transition: transform .25s;
    }
    .card.open .chevron { transform: rotate(180deg); }

    /* ── ACCORDION BODY ──────────────────────── */
    .card-body {
      display: none;
      padding: 0 14px 14px;
      border-top: 1px solid var(--beige-dark);
      background: var(--green-pale);
    }
    .card.rain .card-body { background: #f7fbff; border-top-color: var(--rain-border); }
    .card.open .card-body { display: block; }

    .card-description {
      font-size: .88rem;
      line-height: 1.6;
      color: var(--text);
      margin: 12px 0 10px;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .meta-row {
      display: flex;
      gap: 7px;
      font-size: .82rem;
      color: var(--text-light);
      align-items: flex-start;
    }
    .meta-label {
      font-weight: 600;
      color: var(--green-dark);
      white-space: nowrap;
    }

    .card-hint {
      font-size: .78rem;
      background: #fff8e6;
      border-left: 3px solid #e5b030;
      border-radius: 0 6px 6px 0;
      padding: 5px 9px;
      margin-bottom: 12px;
      color: #7a5a00;
    }

    .card-link {
      display: inline-block;
      font-size: .82rem;
      color: var(--green-dark);
      text-decoration: none;
      border-bottom: 1.5px solid var(--green-mid);
      margin-bottom: 14px;
      padding-bottom: 1px;
      word-break: break-all;
    }
    .card-link:hover { color: var(--green-mid); }

    /* ── JOIN BUTTON ─────────────────────────── */
    .btn-join {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      letter-spacing: .02em;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-join:active { opacity: .88; transform: scale(.98); }

    /* ── PARTICIPANTS ─────────────────────────── */
    .participants {
      margin-top: 12px;
      min-height: 0;
    }
    .participants-label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--green-light);
      color: var(--green-dark);
      border-radius: 20px;
      padding: 4px 10px 4px 8px;
      font-size: .82rem;
      font-weight: 600;
      border: 1px solid var(--green-mid);
    }
    .chip-remove {
      background: none;
      border: none;
      cursor: pointer;
      font-size: .75rem;
      color: var(--green-dark);
      opacity: .6;
      padding: 0 0 0 2px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
    .chip-remove:hover { opacity: 1; }

    /* ── MODAL ───────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--white);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 28px 24px 36px;
      width: 100%;
      max-width: 480px;
      animation: slideUp .22s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green-dark);
      margin-bottom: 6px;
    }
    .modal p {
      font-size: .85rem;
      color: var(--text-light);
      margin-bottom: 18px;
    }
    .modal input[type="text"] {
      display: block;
      width: 100%;
      border: 1.5px solid var(--beige-dark);
      border-radius: 9px;
      padding: 13px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
      background: var(--beige);
      color: var(--text);
    }
    .modal input[type="text"]:focus { border-color: var(--green-mid); background: var(--white); }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-confirm {
      flex: 1;
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      color: var(--white);
      border: none;
      border-radius: 9px;
      padding: 13px;
      font-size: .97rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-confirm:active { opacity: .85; }
    .btn-cancel {
      background: var(--beige);
      color: var(--text-light);
      border: 1.5px solid var(--beige-dark);
      border-radius: 9px;
      padding: 13px 18px;
      font-size: .97rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-error {
      font-size: .8rem;
      color: #c0392b;
      margin-top: 6px;
      min-height: 18px;
    }

    /* ── FOOTER ──────────────────────────────── */
    footer {
      max-width: 480px;
      margin: 8px auto 0;
      text-align: center;
      font-size: .75rem;
      color: var(--text-light);
      padding: 0 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  <h1>🌿 Drenthe Ausflüge</h1>
  <p>Stimmt ab – welche Aktivitäten wollt ihr machen?</p>
</header>

<div class="summary" id="summary">0 von 20 Personen haben abgestimmt</div>

<main id="activity-list"></main>

<footer>Alle Preise Stand April 2026 – Änderungen vorbehalten.</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">Wie heisst du?</h2>
    <p id="modal-subtitle">Trage deinen Namen ein, um dich anzumelden.</p>
    <input type="text" id="modal-input" placeholder="z. B. Papa" maxlength="40" autocomplete="off" />
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Abbrechen</button>
      <button class="btn-confirm" id="modal-confirm">Ich bin dabei! 🙋</button>
    </div>
  </div>
</div>

<script>
  const ACTIVITIES = [
    {
      id: "wildlands",
      emoji: "🦁",
      name: "WILDLANDS Adventure Zoo",
      tagline: "Zoo & Freizeitpark – Dschungel, Savanne, Polargebiet",
      description: "Zoo und Freizeitpark in einem mit drei Themenwelten: Dschungel (Bootsfahrt, Elefanten, Gibbons), Savanne (Truck-Safari mit Giraffen & Nashörnern) und Polargebiet (Eisbären, Seelöwen). Achterbahn für die Älteren, riesige Indoor-Dschungelhalle für die Kleinen.",
      price: "ca. 20–30 € p.P. | Kinder unter 3 Jahren kostenlos",
      dogs: "❌ Nicht erlaubt",
      website: "wildlands.de",
      hint: "Vorab online buchen!",
      rain: false
    },
    {
      id: "kanu",
      emoji: "🛶",
      name: "Kanufahren auf der Hunze",
      tagline: "Entspannte Kanutour durch die Natur – 2 bis 6 Stunden",
      description: "Kanutour auf dem Fluss Hunze mit Gruppenführer, Kaffeepause unterwegs und Rückholung am Zielort. Kinder ab ca. 4 Jahren können mit ins Boot.",
      price: "Gruppenpreis auf Anfrage",
      dogs: "🔍 Bitte direkt beim Anbieter anfragen",
      website: "breelandrecreatie.nl",
      hint: "Gruppenanfrage per Mail empfohlen!",
      rain: false
    },
    {
      id: "slagharen",
      emoji: "🎢",
      name: "Attractiepark Slagharen",
      tagline: "Wilder Westen – 50+ Attraktionen für alle",
      description: "Über 50 Attraktionen, 2 Achterbahnen, Wildwasserbahn, Shows und Ponyreiten. Triple Launch Coaster \u201eGold Rush\u201c bis 95 km/h für die Mutigen, sanfte Fahrgeschäfte für die Kleinen. Wasserpark Aqua Mexicana mit 10 Rutschen optional (8 \u20AC Aufpreis).",
      price: "20–36 € p.P. (online mind. 5 Tage vorher = bis 30% Rabatt) | Kinder unter 4 Jahren kostenlos",
      dogs: "✅ Ja, an der Leine erlaubt. Gassi-Bereich vorhanden, kostenlos.",
      website: "slagharen.com",
      hint: "Tickets online vorbuchen!",
      rain: false
    },
    {
      id: "boomkroonpad",
      emoji: "🌿",
      name: "Boomkroonpad Drouwen",
      tagline: "Wandern auf 22,5 m Höhe durch die Baumkronen",
      description: "Start in einem unterirdischen Wurzeltunnel, dann hinauf ins Blätterdach mit Panoramablick. Anschliessend Wanderung durch den Nationalpark möglich. ⚠️ Nur über Treppen erreichbar – nicht geeignet für Kinderwagen oder Rollstühle.",
      price: "Erwachsene 4,50 € | Kinder (4–12 J.) 2,25 € | unter 4 Jahren kostenlos",
      dogs: "❌ Nicht auf dem Pfad – im Wald drumherum an der Leine willkommen.",
      website: "staatsbosbeheer.nl",
      hint: null,
      rain: false
    },
    {
      id: "giethoorn",
      emoji: "⛵",
      name: "Giethoorn – Bootsausflug",
      tagline: "Das Venedig des Nordens – Flüsterboote durch Grachten",
      description: "Ein Dorf ganz ohne Strassen – nur Grachten und Brücken. Mehrere Flüsterboote mieten und auf eigene Faust erkunden. Kein Bootsführerschein nötig, Hunde willkommen an Bord.",
      price: "ab ca. 32 € pro Boot/Stunde (mehrere Boote nötig, Tagesmiete günstiger)",
      dogs: "✅ Ja, kostenlos an Bord!",
      website: "zwaantje.nl",
      hint: "Vorab buchen – wird schnell ausgebucht!",
      rain: false
    },
    {
      id: "gefaengnis",
      emoji: "🔐",
      name: "Gevangenismuseum Veenhuizen",
      tagline: "Nationales Gefängnismuseum – einzigartig in Holland",
      description: "Echte Zellen erleben, Boevenbus-Rundfahrt durch das Gefängnisdorf, Schatzsuche für Kinder. Faszinierend für alle Altersgruppen. Nur bei Regen empfohlen.",
      price: "Erwachsene 15 € | Kinder (5–12 J.) 7,50 € | unter 5 Jahren kostenlos",
      dogs: "🔍 Bitte vorab anfragen",
      website: "gevangenismuseum.nl",
      hint: null,
      rain: true
    },
    {
      id: "hofvansaksen",
      emoji: "🏊",
      name: "Hof van Saksen – Subtropisch Schwimmbad",
      tagline: "Riesen-Rutschen & Indoor-Spielparadies – ideal bei Regen",
      description: "Grosse Rutschen, Wildwasserbahn, Kletterturm und 1.000 m² Indoor-Spielparadies. Perfekt für einen ganzen Regentag. Nur bei Regen empfohlen.",
      price: "Bitte auf hofvansaksen.nl prüfen",
      dogs: "❌ Nicht im Schwimmbadbereich",
      website: "hofvansaksen.nl",
      hint: null,
      rain: true
    },
    {
      id: "drentsmuseum",
      emoji: "🏛️",
      name: "Drents Museum + Kletterpark Adventureland",
      tagline: "Museum & Klettern – ideal für gemischte Gruppen bei Regen",
      description: "Interaktives Geschichtsmuseum in Assen mit Familienführungen und Kinderaufgaben für alle. Kombinierbar mit dem Indoor-Kletterpark Adventureland (ab 7 J., ~17 Min. entfernt). Nur bei Regen empfohlen.",
      price: "Preise auf drentsmuseum.nl und adventureland.nl",
      dogs: "❌ Nicht erlaubt",
      website: "drentsmuseum.nl",
      hint: null,
      rain: true
    },
    {
      id: "drentseKoe",
      emoji: "🐄",
      name: "De Drentse Koe – Spiel- & Eishof",
      tagline: "20.000 m² Abenteuer mit Tieren – bestes Ausflugsziel Drenthes",
      description: "20.000 m² Abenteuer mit Tieren, Indoor-Spielbereichen und Eis-Erlebnis. Gewählt zum besten Ausflugsziel in Drenthe. Ideal für die Kleinsten. Nur bei Regen empfohlen.",
      price: "Bitte auf drentse-koe.nl prüfen",
      dogs: "🔍 Bitte vorab anfragen",
      website: "drentse-koe.nl",
      hint: null,
      rain: true
    }
  ];

  const TOTAL_PEOPLE = 20;
  const STORAGE_KEY = "drenthe_votes_v1";

  // ── STATE ────────────────────────────────────
  function loadVotes() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) { return {}; }
  }
  function saveVotes(votes) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
  }

  let votes = loadVotes(); // { activityId: ["Papa", "Mama", ...] }

  // ── MODAL STATE ──────────────────────────────
  let pendingActivityId = null;
  const overlay   = document.getElementById("modal-overlay");
  const modalInput   = document.getElementById("modal-input");
  const modalError   = document.getElementById("modal-error");
  const modalSubtitle = document.getElementById("modal-subtitle");
  const modalConfirm = document.getElementById("modal-confirm");
  const modalCancel  = document.getElementById("modal-cancel");

  function openModal(activityId) {
    pendingActivityId = activityId;
    const act = ACTIVITIES.find(a => a.id === activityId);
    modalSubtitle.textContent = `Du meldest dich für „${act.name}" an.`;
    modalInput.value = "";
    modalError.textContent = "";
    overlay.classList.add("active");
    setTimeout(() => modalInput.focus(), 80);
  }

  function closeModal() {
    overlay.classList.remove("active");
    pendingActivityId = null;
    modalInput.value = "";
    modalError.textContent = "";
  }

  function confirmJoin() {
    const name = modalInput.value.trim();
    if (!name) {
      modalError.textContent = "Bitte gib deinen Namen ein.";
      modalInput.focus();
      return;
    }
    if (!votes[pendingActivityId]) votes[pendingActivityId] = [];
    const list = votes[pendingActivityId];
    const nameLower = name.toLowerCase();
    if (list.some(n => n.toLowerCase() === nameLower)) {
      modalError.textContent = "Du bist bereits angemeldet!";
      return;
    }
    list.push(name);
    saveVotes(votes);
    renderParticipants(pendingActivityId);
    updateSummary();
    closeModal();
  }

  modalConfirm.addEventListener("click", confirmJoin);
  modalCancel.addEventListener("click", closeModal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  modalInput.addEventListener("keydown", e => { if (e.key === "Enter") confirmJoin(); });

  // ── SUMMARY ──────────────────────────────────
  function updateSummary() {
    const allNames = new Set();
    Object.values(votes).forEach(list => list.forEach(n => allNames.add(n.toLowerCase())));
    const count = allNames.size;
    document.getElementById("summary").textContent =
      `${count} von ${TOTAL_PEOPLE} Personen haben abgestimmt`;
  }

  // ── RENDER PARTICIPANTS ───────────────────────
  function renderParticipants(id) {
    const container = document.getElementById(`participants-${id}`);
    if (!container) return;
    const list = votes[id] || [];
    if (list.length === 0) {
      container.innerHTML = "";
      return;
    }
    container.innerHTML =
      `<div class="participants-label">🙋 Angemeldet (${list.length}):</div>` +
      `<div class="chips">` +
      list.map(name =>
        `<span class="chip">
          ${escHtml(name)}
          <button class="chip-remove" aria-label="${escHtml(name)} entfernen" data-activity="${id}" data-name="${escHtml(name)}">✕</button>
        </span>`
      ).join("") +
      `</div>`;
  }

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── BUILD CARDS ───────────────────────────────
  function buildCards() {
    var container = document.getElementById("activity-list");
    if (!container) return;
    var html = "";
    for (var i = 0; i < ACTIVITIES.length; i++) {
      var act = ACTIVITIES[i];
      var rainClass = act.rain ? " rain" : "";
      var rainBadge = act.rain ? '<span class="rain-badge">\uD83C\uDF27\uFE0F Regenalternative</span>' : "";
      var hintHtml  = act.hint ? '<div class="card-hint">\uD83D\uDCA1 ' + escHtml(act.hint) + '</div>' : "";
      html += '<div class="card' + rainClass + '" id="card-' + act.id + '">';
      html += '<div class="card-header" role="button" tabindex="0" aria-expanded="false" aria-controls="body-' + act.id + '" data-toggle="' + act.id + '">';
      html += '<span class="card-emoji">' + act.emoji + '</span>';
      html += '<div class="card-title-wrap">';
      html += '<div class="card-title">' + escHtml(act.name) + '</div>';
      html += '<div class="card-tagline">' + escHtml(act.tagline) + '</div>';
      html += '</div>';
      html += '<div class="card-right">' + rainBadge + '<span class="chevron">&#9660;</span></div>';
      html += '</div>'; // card-header
      html += '<div class="card-body" id="body-' + act.id + '">';
      html += '<p class="card-description">' + escHtml(act.description) + '</p>';
      html += '<div class="card-meta">';
      html += '<div class="meta-row"><span class="meta-label">Preis:</span><span>' + escHtml(act.price) + '</span></div>';
      html += '<div class="meta-row"><span class="meta-label">Hunde:</span><span>' + escHtml(act.dogs) + '</span></div>';
      html += '</div>';
      html += hintHtml;
      html += '<a class="card-link" href="https://' + act.website + '" target="_blank" rel="noopener noreferrer">\uD83C\uDF10 ' + escHtml(act.website) + '</a>';
      html += '<button class="btn-join" data-join="' + act.id + '">Ich bin dabei! \uD83D\uDE4B</button>';
      html += '<div class="participants" id="participants-' + act.id + '"></div>';
      html += '</div>'; // card-body
      html += '</div>'; // card
    }
    container.innerHTML = html;
    for (var j = 0; j < ACTIVITIES.length; j++) {
      renderParticipants(ACTIVITIES[j].id);
    }
  }

  // ── ACCORDION ────────────────────────────────
  function toggleCard(id) {
    var card   = document.getElementById("card-" + id);
    var header = card.querySelector(".card-header");
    var isOpen = card.classList.contains("open");
    card.classList.toggle("open", !isOpen);
    header.setAttribute("aria-expanded", isOpen ? "false" : "true");
  }

  // ── GLOBAL CLICK DELEGATION ───────────────────
  document.addEventListener("click", function(e) {
    // accordion toggle
    var header = e.target.closest("[data-toggle]");
    if (header) { toggleCard(header.getAttribute("data-toggle")); return; }

    // join button
    var joinBtn = e.target.closest("[data-join]");
    if (joinBtn) { openModal(joinBtn.getAttribute("data-join")); return; }

    // remove chip
    var removeBtn = e.target.closest(".chip-remove");
    if (removeBtn) {
      var id   = removeBtn.getAttribute("data-activity");
      var name = removeBtn.getAttribute("data-name");
      if (votes[id]) {
        votes[id] = votes[id].filter(function(n) { return n !== name; });
        saveVotes(votes);
        renderParticipants(id);
        updateSummary();
      }
      return;
    }

    // close modal on overlay click
    if (e.target === overlay) { closeModal(); }
  });

  // keyboard: open accordion on Enter / Space
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var header = e.target.closest("[data-toggle]");
    if (header) { e.preventDefault(); toggleCard(header.getAttribute("data-toggle")); }
  });

  // ── INIT ─────────────────────────────────────
  buildCards();
  updateSummary();
</script>
</body>
</html>
